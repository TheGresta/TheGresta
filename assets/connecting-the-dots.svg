<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" role="img" aria-label="Connecting the Dots">
  <title>Connecting the Dots — shortest path</title>
  <desc>Dijkstra explores a weighted graph, then the cheapest route lights up.</desc>
  <defs><linearGradient id="ctd" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#E879F9"/>
  </linearGradient></defs>
  <style>
    /* Every animation shares one 9s loop and returns to its starting state,
       so the cycle repeats seamlessly. Only opacity and transform are
       animated; CSS animation of the SVG r property is not dependable. */
    .edge{stroke:#7C3AED;stroke-width:1.5;fill:none;opacity:0;animation:ctd-in 9s ease-out infinite}
    .wt{font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:10px;fill:#A855F7;opacity:0;animation:ctd-inw 9s ease-out infinite}
    .node{fill:#7C3AED;opacity:0;animation:ctd-inn 9s ease-out infinite}
    .exp{fill:none;stroke:#A855F7;stroke-width:1.5;opacity:0}
    .pe{stroke:url(#ctd);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
    .pn{fill:#E879F9;opacity:0}
    .pkt{fill:#F5D0FE;opacity:0}
    .tag{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif;font-size:30px;font-weight:600;
         letter-spacing:3.5px;fill:url(#ctd);opacity:0;animation:ctd-tag 9s ease-out infinite}
    .cap{font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:11px;fill:#A855F7;
         opacity:0;animation:ctd-cap 9s ease-out infinite}
    @keyframes ctd-in{0%{opacity:0}5%,93%{opacity:.30}100%{opacity:0}}
    @keyframes ctd-inw{0%{opacity:0}5%,93%{opacity:.55}100%{opacity:0}}
    @keyframes ctd-inn{0%{opacity:0}5%,93%{opacity:.45}100%{opacity:0}}
    @keyframes ctd-tag{0%,12%{opacity:0}20%,93%{opacity:1}100%{opacity:0}}
    @keyframes ctd-cap{0%,55%{opacity:0}60%,93%{opacity:.5}100%{opacity:0}}
    @keyframes ctd-e1{0%,10.00%{opacity:0;transform:scale(.4)}12.20%{opacity:.9;transform:scale(1)}19.00%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-e3{0%,12.83%{opacity:0;transform:scale(.4)}15.03%{opacity:.9;transform:scale(1)}21.83%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-e2{0%,15.67%{opacity:0;transform:scale(.4)}17.87%{opacity:.9;transform:scale(1)}24.67%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-e5{0%,18.50%{opacity:0;transform:scale(.4)}20.70%{opacity:.9;transform:scale(1)}27.50%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-e4{0%,21.33%{opacity:0;transform:scale(.4)}23.53%{opacity:.9;transform:scale(1)}30.33%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-e6{0%,24.17%{opacity:0;transform:scale(.4)}26.37%{opacity:.9;transform:scale(1)}33.17%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-e7{0%,27.00%{opacity:0;transform:scale(.4)}29.20%{opacity:.9;transform:scale(1)}36.00%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-e8{0%,29.83%{opacity:0;transform:scale(.4)}32.03%{opacity:.9;transform:scale(1)}38.83%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-e10{0%,32.67%{opacity:0;transform:scale(.4)}34.87%{opacity:.9;transform:scale(1)}41.67%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-e9{0%,35.50%{opacity:0;transform:scale(.4)}37.70%{opacity:.9;transform:scale(1)}44.50%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-e12{0%,38.33%{opacity:0;transform:scale(.4)}40.53%{opacity:.9;transform:scale(1)}47.33%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-e11{0%,41.17%{opacity:0;transform:scale(.4)}43.37%{opacity:.9;transform:scale(1)}50.17%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes ctd-pe{0%,46%{opacity:0;stroke-dashoffset:761.2px}47%{opacity:1;stroke-dashoffset:761.2px}57%,93%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
    @keyframes ctd-p1{0%,57.00%{opacity:0}58.50%,93%{opacity:1}100%{opacity:0}}
    @keyframes ctd-p3{0%,57.80%{opacity:0}59.30%,93%{opacity:1}100%{opacity:0}}
    @keyframes ctd-p5{0%,58.60%{opacity:0}60.10%,93%{opacity:1}100%{opacity:0}}
