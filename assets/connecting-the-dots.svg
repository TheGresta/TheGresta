    @keyframes ctd-p12{0%,61.00%{opacity:0}62.50%,93%{opacity:1}100%{opacity:0}}
    @keyframes ctd-k1{0%,60.00%{opacity:0;transform:translate(55px,80px)}60.01%{opacity:1;transform:translate(55px,80px)}64.40%{opacity:1;transform:translate(200px,125px)}64.41%,100%{opacity:0;transform:translate(200px,125px)}}
    @keyframes ctd-k2{0%,64.40%{opacity:0;transform:translate(200px,125px)}64.41%{opacity:1;transform:translate(200px,125px)}68.80%{opacity:1;transform:translate(350px,80px)}68.81%,100%{opacity:0;transform:translate(350px,80px)}}
    @keyframes ctd-k3{0%,68.80%{opacity:0;transform:translate(350px,80px)}68.81%{opacity:1;transform:translate(350px,80px)}73.20%{opacity:1;transform:translate(510px,35px)}73.21%,100%{opacity:0;transform:translate(510px,35px)}}
    @keyframes ctd-k4{0%,73.20%{opacity:0;transform:translate(510px,35px)}73.21%{opacity:1;transform:translate(510px,35px)}77.60%{opacity:1;transform:translate(660px,80px)}77.61%,100%{opacity:0;transform:translate(660px,80px)}}
    @keyframes ctd-k5{0%,77.60%{opacity:0;transform:translate(660px,80px)}77.61%{opacity:1;transform:translate(660px,80px)}82.00%{opacity:1;transform:translate(790px,80px)}82.01%,100%{opacity:0;transform:translate(790px,80px)}}
